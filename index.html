<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension & MCP Supply Chain Auditor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>extension-audit-tool</h1>
            <span class="badge">v1.1.0</span>
        </div>
        <p class="subtitle">Read-only security posture analysis for local MCP servers, extensions, and plugins.</p>
    </header>

    <main class="dashboard">
        <section class="metrics-grid">
            <div class="metric-card high">
                <span class="metric-title">High Risk Issues</span>
                <span class="metric-value" id="countHigh">0</span>
            </div>
            <div class="metric-card med">
                <span class="metric-title">Medium Risk Issues</span>
                <span class="metric-value" id="countMed">0</span>
            </div>
            <div class="metric-card low">
                <span class="metric-title">Low Risk / Verified</span>
                <span class="metric-value" id="countLow">0</span>
            </div>
        </section>

        <section class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search audit items...">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="high">High</button>
                <button class="filter-btn" data-filter="medium">Medium</button>
                <button class="filter-btn" data-filter="low">Low</button>
            </div>
            <div class="actions">
                <button id="exportJson">Export JSON</button>
                <button id="exportCsv">Export CSV</button>
            </div>
        </section>

        <section id="auditResults" class="results-container">
            <!-- Dynamic audit cards rendered here -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
