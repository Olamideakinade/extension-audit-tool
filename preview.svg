<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="800" height="350" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- macOS Window Header Bar -->
  <rect width="800" height="42" rx="16" fill="#0f172a"/>
  <rect y="26" width="800" height="16" fill="#0f172a"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="400" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">extension-audit-tool • release preview</text>

  <!-- Perspective Horizon Grid in Background -->
  <path d="M 0 350 L 300 150 L 500 150 L 800 350 Z" fill="url(#gridGrad)"/>
  <line x1="400" y1="150" x2="400" y2="350" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="300" y1="150" x2="100" y2="350" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="500" y1="150" x2="700" y2="350" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="180" y1="230" x2="620" y2="230" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="100" y1="285" x2="700" y2="285" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Badges Row -->
  <g transform="translate(45, 68)">
    <rect width="140" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ CUSTOM COMMUNITY PROJECT</text>

    <rect x="150" width="130" height="24" rx="12" fill="#16a34a" fill-opacity="0.2" stroke="#4ade80" stroke-width="1"/>
    <text x="215" y="16" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ OPEN SOURCE</text>

    <rect x="290" width="150" height="24" rx="12" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="365" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ VERIFIED BUILD</text>
  </g>

  <!-- Project Title -->
  <text x="45" y="145" fill="url(#neonTitle)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Extension &amp; MCP Supply Chain Auditor</text>

  <!-- Description lines -->
  <text x="45" y="185" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Lightweight client-side auditor for inspecting installed MCP servers,</text>
  <text x="45" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">VS Code extensions, and browser plugins.</text>

  <!-- Tech Stack Chips -->
  <g transform="translate(45, 275)">
    <rect width="180" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="21" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle">🛠 HTML5 / Vanilla JavaScript / CSS3</text>
  </g>

  
  <!-- Live Demo CTA Pill -->
  <g transform="translate(480, 270)">
    <rect width="260" height="42" rx="21" fill="url(#btnGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <text x="130" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🎮 PLAY LIVE ON GITHUB PAGES</text>
  </g>

</svg>